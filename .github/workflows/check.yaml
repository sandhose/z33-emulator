on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow dispatches this one on release branches: PRs opened
  # with GITHUB_TOKEN don't trigger `pull_request` events, so the required
  # status checks have to be started explicitly.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

name: Check

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that all manifests agree on one version
        run: scripts/check-version-sync.sh

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo test
        run: cargo test --workspace

  rustfmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustfmt.toml uses nightly-only options, so format checks run on nightly
      # regardless of the pinned toolchain in rust-toolchain.toml. Bump the
      # nightly date together with rust-toolchain.toml.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly-2026-09-01 --component rustfmt

      - name: Run cargo fmt
        run: cargo +nightly-2026-09-01 fmt --all -- --check

  clippy:
    name: Clippy lints
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets

  deny:
    name: "`cargo deny` audit"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # `pnpm -r run check` also type-checks: the web and vscode packages both run
  # tsc from it. The job name is a required status check, so it stays as is.
  lint:
    name: "oxlint + oxfmt check"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the wasm bindings
        run: pnpm --filter z33-editor-shared run build:wasm

      - name: Run lint and format check
        run: pnpm -r run check

      - name: Check for unused exports
        run: pnpm -r --filter './editors/web' knip

      # The Pages deploy is the only other place the production build runs,
      # and it only runs on pushes to main.
      - name: Production build of the web app
        run: pnpm --filter z33-web exec vite build

      - name: Check Monaco stays off the entry chunk
        run: pnpm --filter z33-web run check:chunks

  e2e:
    name: "Playwright E2E tests"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/web
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps

      - name: Run Playwright tests
        run: pnpm run e2e

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            editors/web/playwright-report/
            editors/web/test-results/
          retention-days: 7

  vscode-e2e:
    name: "VS Code extension E2E tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Jobs share no filesystem, so the wasm build of the lint job is
      # repeated here.
      - name: Build the wasm bindings
        run: pnpm --filter z33-editor-shared run build:wasm

      - name: Build the extension bundle
        run: pnpm --filter z33-assembly run build:bundle

      - name: Install Playwright browsers
        working-directory: editors/vscode
        run: npx playwright install chromium --with-deps

      # The VS Code web build is resolved at run time from --quality stable,
      # so playwright.config.ts pins it to a fixed commit instead; read that
      # pin here so the cache key tracks it.
      - name: Read the pinned VS Code build commit
        id: vscode-commit
        run: |
          sha=$(grep -o 'VSCODE_WEB_COMMIT = "[0-9a-f]*"' editors/vscode/playwright.config.ts | grep -o '[0-9a-f]\{40\}')
          if [ -z "$sha" ]; then
            echo "::error::VSCODE_WEB_COMMIT not found in editors/vscode/playwright.config.ts" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The VS Code web build (about 55 MB) is downloaded by @vscode/test-web
      # on first run; keying on the pinned commit means the cache is only
      # invalidated when that pin moves, not on every new stable release.
      - name: Restore VS Code web build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test-web
          key: vscode-test-web-${{ steps.vscode-commit.outputs.sha }}
          restore-keys: vscode-test-web-

      # The three Playwright webServers in playwright.config.ts each have their
      # own data directory and would all try to download the VS Code web build
      # on a cold cache; download it once here and copy it into the other two.
      - name: Warm the VS Code web build cache
        working-directory: editors/vscode
        env:
          SHA: ${{ steps.vscode-commit.outputs.sha }}
        run: |
          timeout 300 pnpm exec vscode-test-web --browser none --quality stable --commit "$SHA" --testRunnerDataDir .vscode-test-web/bare --extensionDevelopmentPath=. e2e/workspaces/bare > /tmp/warmup.log 2>&1 &
          pid=$!
          until grep -q 'Listening on' /tmp/warmup.log; do
            sleep 2
            kill -0 $pid || { cat /tmp/warmup.log; exit 1; }
          done
          kill $pid
          for name in launch untitled; do
            [ -d ".vscode-test-web/$name" ] || cp -r .vscode-test-web/bare ".vscode-test-web/$name"
          done

      - name: Run Playwright tests
        working-directory: editors/vscode
        run: pnpm run e2e

      # A cache written from a pull request would be served to later runs on
      # main, so only main saves.
      - name: Save VS Code web build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: editors/vscode/.vscode-test-web
          key: vscode-test-web-${{ steps.vscode-commit.outputs.sha }}

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: vscode-playwright-report
          path: |
            editors/vscode/playwright-report/
            editors/vscode/test-results/
          retention-days: 7
          if-no-files-found: ignore

  vitest:
    name: "Vitest tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Only the web-storybook project needs this: its story graph reaches
      # lib/wasm-module.ts, whose `?url` import vite has to resolve to a real
      # file. No story instantiates the binary, so the dev build is enough.
      - name: Build the wasm bindings
        run: pnpm --filter z33-editor-shared run build:wasm:dev

      # Only the web-storybook project needs a browser; the others run in node.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Vitest projects
        run: pnpm run test

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: Regenerate the parser
        run: pnpm --filter tree-sitter-z33 run generate

      - name: Ensure the committed parser is up to date
        run: git diff --exit-code tree-sitter-z33/src/

      - name: Run corpus tests
        run: pnpm --filter tree-sitter-z33 run test

  zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the Zed extension
        run: cargo build -p z33-zed --target wasm32-wasip1

  editors-vim-nvim:
    name: "Vim & Neovim plugins smoke test"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Install classic Vim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: false
          version: stable

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The code lens test drives a real language server and a real run.
      - name: Build z33-cli
        run: cargo build -p z33-cli

      - name: Neovim smoke test
        run: nvim --headless -u NONE -N -l editors/vim/tests/smoke.lua

      - name: Neovim code lens test
        run: PATH="$PWD/target/debug:$PATH" nvim --headless -u NONE -N -l editors/vim/tests/lens.lua

      - name: Vim smoke test
        run: |
          cat > /tmp/z33-vim-smoke.vim <<'VIMSCRIPT'
          " CI smoke test for the classic Vim plugin (editors/vim/): just
          " enough to catch "plugin doesn't even load" regressions --
          " ftdetect + syntax must both engage on a real Z33 sample.
          set rtp+=editors/vim
          filetype plugin indent on
          syntax on
          edit samples/fact.s
          if &filetype !=# 'z33'
            call writefile(['FAIL: expected filetype z33, got: ' . &filetype], '/tmp/z33-vim-smoke-result.txt')
            cquit 1
          endif
          if !exists('b:current_syntax') || b:current_syntax !=# 'z33'
            call writefile(['FAIL: expected syntax z33, got: ' . get(b:, 'current_syntax', '<unset>')], '/tmp/z33-vim-smoke-result.txt')
            cquit 1
          endif
          " The content heuristic has a second hand-written copy in
          " ftdetect/z33.vim; run it over the same fixture corpus the Neovim
          " smoke test uses, so the two cannot drift apart silently. No
          " third-party .s/.S claimant is installed on the runner, so
          " fixtures/z33 must come out as z33 and fixtures/asm as the
          " builtin's asm.
          let checked = {'z33': 0, 'asm': 0}
          for want in ['z33', 'asm']
            for fixture in glob('editors/vim/tests/fixtures/' . want . '/*', 0, 1)
              execute 'edit' fnameescape(fixture)
              if &filetype !=# want
                call writefile(['FAIL: ' . fixture . ': filetype ' . &filetype . ', expected ' . want], '/tmp/z33-vim-smoke-result.txt')
                cquit 1
              endif
              let checked[want] += 1
            endfor
          endfor
          if checked.z33 + checked.asm < 10
            call writefile(['FAIL: fixture corpus not found, checked ' . (checked.z33 + checked.asm) . ' files'], '/tmp/z33-vim-smoke-result.txt')
            cquit 1
          endif
          call writefile(['OK: samples/fact.s got filetype and syntax z33; ' . checked.z33 . ' z33 and ' . checked.asm . ' asm fixtures matched'], '/tmp/z33-vim-smoke-result.txt')
          qall!
          VIMSCRIPT
          vim -es -N -u NONE -S /tmp/z33-vim-smoke.vim
          cat /tmp/z33-vim-smoke-result.txt

  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required for SARIF upload to GitHub Security tab
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
