<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Zorglub-33 assembly IDE and debugger: write, run and step through Z33 programs in the browser.">
    <title>z33-emulator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      // Mirror of app/stores/theme-store.ts: same storage key and class names.
      try {
        var stored = JSON.parse(localStorage.getItem("z33:theme") || "null");
        var theme = stored && stored.state && stored.state.theme;
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        // The --background tokens from app/globals.css, so the page is the
        // right colour before the stylesheet arrives.
        document.documentElement.style.backgroundColor =
          theme === "dark" ? "oklch(0.145 0 0)" : "oklch(1 0 0)";
      } catch (e) {}
    </script>
    <style>
      /* Skeleton shown until the app mounts; colours follow the theme class
         set by the script above and approximate the tokens in app/globals.css.
         The bar is the height of the edit toolbar (h-6 content plus py-1) and
         the column the width of the sidebar, border included, so nothing shifts
         when React takes over; both spell out box-sizing because Tailwind's
         preflight is not loaded yet. */
      .skeleton { position: fixed; inset: 0; display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #6b7280; }
      .skeleton-bar { box-sizing: content-box; height: 2rem; border-bottom: 1px solid #e5e7eb; }
      .skeleton-body { flex: 1; display: flex; min-height: 0; }
      .skeleton-side { box-sizing: border-box; width: 12rem; border-right: 1px solid #e5e7eb; }
      .skeleton-main { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; }
      .dark .skeleton { color: #9ca3af; }
      .dark .skeleton-bar, .dark .skeleton-side { border-color: #262626; }
    </style>
    <script src="app/index.tsx" type="module"></script>
</head>

<body>
    <div id="root">
      <div class="skeleton" aria-busy="true">
        <div class="skeleton-bar"></div>
        <div class="skeleton-body">
          <div class="skeleton-side"></div>
          <div class="skeleton-main">Loading the editor…</div>
        </div>
      </div>
    </div>
</body>

</html>
