[workspace]
resolver = "2"

members = ["crates/emulator", "crates/cli", "crates/wasm", "editors/zed"]

[workspace.package]
description = "An emulator for the Zorglub-33 architecture"
homepage = "https://pdagog.gitlab.io/ens/z33refcard.pdf"
repository = "https://github.com/sandhose/z33-emulator"
version = "0.8.4"
authors = ["Quentin Gliech <gliech@unistra.fr>"]
edition = "2024"
readme = "README.md"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
bitflags = "2.13.1"
camino = { version = "1.2.5", features = ["serde1"] }
chumsky = { version = "0.13.0", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
codespan-reporting = "0.13.1"
clap_complete = "4.6.9"
console_error_panic_hook = "0.1.7"
indoc = "2.0.7"
insta = "1.48.0"
js-sys = "0.3.104"
lsp-types = "0.97"
parse-display = "0.11.0"
percent-encoding = "2.3.2"
pretty_assertions = "1.4.1"
rustyline = "18.0.1"
rustyline-derive = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
smallvec = "1"
serde-wasm-bindgen = "0.6.5"
shell-words = "1.1.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-wasm = "0.2.1"
tsify = { version = "0.5.8", features = ["js"], default-features = false }
unicode-segmentation = "1.13.3"
wasm-bindgen = "0.2.127"
z33-emulator = { path = "crates/emulator" }

[profile.release]
lto = "thin"
panic = "abort"
debug = "limited"
