# $schema: https://www.schemastore.org/pnpm-workspace.json

packages:
  - editors/shared
  - editors/web
  - editors/vscode
  - tree-sitter-z33

catalog:
  wasm-pack: ^0.15.0
  oxlint: ^1.81.0
  oxfmt: ^0.66.0
  typescript: 7.0.2
  vite: ^8.2.2
  vitest: ^4.1.11
  storybook: ^10.6.0
  "@storybook/addon-vitest": ^10.6.0
  "@playwright/test": ^1.62.1

allowBuilds:
  "@vscode/vsce-sign": true
  keytar: true
  tree-sitter-cli: true
  wasm-pack: true
  esbuild: false
  "@playwright/browser-chromium": false

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver
  - reselect@5.1.1

# monaco-editor 0.56 maps "./*" to "./esm/vs/*.js", so the esm/vs deep path
# monaco-types re-exports its types from no longer resolves.
patchedDependencies:
  monaco-types@0.1.2: patches/monaco-types@0.1.2.patch
