# $schema: https://www.schemastore.org/pnpm-workspace.json

packages:
  - editors/web
  - editors/vscode
  - tree-sitter-z33

catalog:
  wasm-pack: ^0.15.0
  oxlint: ^1.81.0
  oxfmt: ^0.66.0
  typescript: 7.0.2

allowBuilds:
  "@vscode/vsce-sign": true
  keytar: true
  tree-sitter-cli: true
  wasm-pack: true
  esbuild: false

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver
  - reselect@5.1.1
